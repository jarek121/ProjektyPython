<!DOCTYPE html>
<html>
<head>
    <title>Moje Pluszaki</title>
</head>
<body>
    {% comment %} Ile pluszaków w bazie: {{ pluszaki|length }} {% endcomment %}
    <h1>Test</h1>
    <ul>
    {% for p in pluszaki %}
        <li>{{ p.imie }} - {{ p.gatunek }}</li> 
    {% empty %}
        <li>Na razie nie masz żadnych pluszaków w bazie.</li>
    {% endfor %}
</ul>
</body>
</html>
